# B0 from the magnet itself: an Aubert ring pair (two coaxial NdFeB rings, one magnetized radially outward, one
# inward), instead of the default uniform field + linear error. The B0 map then carries the magnet's real
# inhomogeneity, which the simulation sees as off-resonance across the phantom.
#
# PLACEHOLDER DIMENSIONS: replace with the real rings' radii, thickness, spacing and remanence. match_larmor scales
# the map so the centre sits at magnet.larmor_hz (as tuning the RF to the magnet does); set it false once the
# dimensions and br_t are real, to predict B0 instead.
#   python -m sim6480 run design/examples/aubert_b0.yaml
fields:
  b0_direction: z
  b0:
    match_larmor: true
    rings:
      - {inner_radius_mm: 20, outer_radius_mm: 50, thickness_mm: 20, axis: z, centre_mm: {z: 30}, br_t: 1.3, magnetization: radial_out}
      - {inner_radius_mm: 20, outer_radius_mm: 50, thickness_mm: 20, axis: z, centre_mm: {z: -30}, br_t: 1.3, magnetization: radial_in}
